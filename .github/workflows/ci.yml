name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # Runs the pre-commit hooks (nixfmt + ruff-format) and the pytest suite,
      # both sandboxed. This alone is a full check; the pytest step below just
      # surfaces test output faster on failure.
      - name: nix flake check
        run: nix flake check --print-build-logs

      - name: pytest
        run: nix develop --command pytest -q tests --cov
